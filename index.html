<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Typing Test</h1>
        <div class="navbar">
            <h1>TypeFast</h1>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="practice.html"><i class="fas fa-keyboard"></i> Practice</a>
                <a href=""><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="setting.html"><i class="fas fa-cog"></i> Settings</a>
            </div>
        </div>
    </header>
    <main>
        <div class="controls">
            <label for="mode"><i class="fas fa-sliders-h"></i> Difficulty:</label>
            <select id="mode">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        
        <div id="word-display">Press any key to start...</div>
        <input type="text" id="input-field" placeholder="Type here..." autofocus>
        <div id="results">Results will appear here</div>
    </main>

    <script src="script.js"></script>
</body>

</html>
